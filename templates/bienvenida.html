{% extends "base.html" %}

{% block title %}Real Madrid | ERP System{% endblock %}

{% block extra_css %}
<style>
    /* Fondo oscuro con un sutil patrón de cuadrícula estilo "Campo de juego" */
    body {
        background-color: #05080f !important; /* Negro azulado profundo */
        background-image: 
            linear-gradient(rgba(0, 83, 158, 0.1) 1px, transparent 1px),
            linear-gradient(90deg, rgba(0, 83, 158, 0.1) 1px, transparent 1px);
        background-size: 40px 40px;
        color: #E2EAF4;
        font-family: 'Inter', sans-serif;
    }

    /* Contenedor principal */
    .madrid-hero {
        padding: 3rem 1rem;
        text-align: center;
    }

    /* Título Principal (Letras del Madrid con efecto Neón Blanco y Dorado) */
    .madrid-title {
        font-family: 'Playfair Display', serif;
        font-size: 4.5rem;
        font-weight: 900;
        color: #FFFFFF;
        letter-spacing: 4px;
        margin-bottom: 0.5rem;
        text-shadow: 
            0 0 10px rgba(255, 255, 255, 0.8),
            0 0 20px rgba(254, 190, 16, 0.6),
            0 0 40px rgba(254, 190, 16, 0.4);
        display: inline-block;
        animation: floatTitle 4s ease-in-out infinite;
    }

    @keyframes floatTitle {
        0% { transform: translateY(0px); }
        50% { transform: translateY(-10px); text-shadow: 0 0 15px rgba(255, 255, 255, 1), 0 0 30px rgba(254, 190, 16, 0.8); }
        100% { transform: translateY(0px); }
    }

    /* Subtítulo */
    .madrid-subtitle {
        font-size: 1rem;
        color: #FEBE10; /* Dorado */
        letter-spacing: 5px;
        text-transform: uppercase;
        font-weight: 700;
        margin-bottom: 3rem;
        text-shadow: 0 0 10px rgba(254, 190, 16, 0.5);
    }

    /* Grid de Tarjetas (Estilo Premium) */
    .madrid-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
        gap: 2rem;
        margin-top: 2rem;
        padding: 0 1rem;
    }

    /* Tarjeta estilo Cristal (Glassmorphism) con detalles Azul Rey */
    .madrid-card {
        background: rgba(10, 16, 30, 0.8);
        border: 2px solid #1A365D; /* Azul oscuro */
        border-radius: 16px;
        padding: 2.5rem 1.5rem;
        text-align: center;
        text-decoration: none;
        position: relative;
        transition: all 0.4s ease;
        overflow: hidden;
        backdrop-filter: blur(10px);
    }

    /* Línea superior que se ilumina al pasar el mouse */
    .madrid-card::before {
        content: '';
        position: absolute;
        top: 0; left: 0; right: 0; height: 4px;
        background: #00539E; /* Azul Rey */
        transition: background 0.4s ease, box-shadow 0.4s ease;
    }

    /* Efecto Hover de la tarjeta */
    .madrid-card:hover {
        transform: translateY(-8px) scale(1.02);
        border-color: #FEBE10; /* Borde Dorado */
        box-shadow: 0 15px 30px rgba(0, 0, 0, 0.6), 0 0 25px rgba(254, 190, 16, 0.2);
        background: rgba(15, 25, 45, 0.9);
    }

    .madrid-card:hover::before {
        background: #FEBE10; /* La línea superior cambia a Dorado */
        box-shadow: 0 0 15px rgba(254, 190, 16, 0.8);
    }

    /* Iconos */
    .madrid-icon {
        font-size: 4rem;
        margin-bottom: 1rem;
        display: inline-block;
        filter: drop-shadow(0 0 10px rgba(255, 255, 255, 0.3));
        transition: transform 0.4s ease;
    }

    .madrid-card:hover .madrid-icon {
        transform: scale(1.15) rotate(5deg);
        filter: drop-shadow(0 0 15px rgba(254, 190, 16, 0.6)); /* Brillo dorado */
    }

    /* Título de la tarjeta */
    .madrid-card h3 {
        font-family: 'Playfair Display', serif;
        font-size: 1.5rem;
        color: #FFFFFF;
        margin-bottom: 0.5rem;
        letter-spacing: 1px;
        transition: color 0.3s ease;
    }

    .madrid-card:hover h3 {
        color: #FEBE10; /* Cambia a Dorado al pasar el mouse */
    }

    /* Texto descriptivo */
    .madrid-card p {
        color: #8AA0B8;
        font-size: 0.9rem;
        margin: 0;
        line-height: 1.5;
        font-family: 'Inter', sans-serif;
        text-transform: uppercase;
        letter-spacing: 1px;
    }

    /* Línea decorativa */
    .gold-line {
        width: 150px;
        height: 3px;
        background: #FEBE10;
        margin: 1.5rem auto;
        box-shadow: 0 0 15px rgba(254, 190, 16, 0.8);
        border-radius: 2px;
    }

    /* Responsividad */
    @media (max-width: 768px) {
        .madrid-title { font-size: 2.8rem; }
        .madrid-grid { grid-template-columns: 1fr; }
    }
</style>
{% endblock %}

{% block content %}
<div class="madrid-hero">
    <!-- Título Principal -->
    <h1 class="madrid-title">ℛℯ𝒶𝓁 ℳ𝒶𝒹𝓇𝒾𝒹</h1>
    <div class="gold-line"></div>
    <p class="madrid-subtitle">Hala Madrid · Sistema ERP</p>

    <!-- Grid de Módulos -->
    <div class="container">
        <div class="madrid-grid">
            {% for m in modulos %}
            <a href="{{ m.url }}" class="madrid-card">
                <span class="madrid-icon">{{ m.icono }}</span>
                <h3>{{ m.nombre }}</h3>
                <p>{{ m.descripcion }}</p>
            </a>
            {% endfor %}
        </div>
    </div>
</div>
{% endblock %}
